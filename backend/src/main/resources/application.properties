# =============================================================================
# H2S Dosimeter Backend - Application Configuration
# =============================================================================
# All sensitive values are read from environment variables.
# See README.md for setup instructions.
#
# Required environment variables:
#   DB_URL      - JDBC URL, e.g. jdbc:mysql://localhost:3306/h2s_dosimeter
#   DB_USERNAME - MySQL username
#   DB_PASSWORD - MySQL password
# =============================================================================

spring.application.name=h2s-dosimeter-backend

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/h2s_dosimeter?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:h2s_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Server ---
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/api

# --- Logging ---
logging.level.com.ankita=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
