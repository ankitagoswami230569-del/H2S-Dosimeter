plugins {
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
}

group = 'com.ankita'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Web (REST APIs)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Boot Data JPA (Hibernate)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Bean Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // MySQL connector
    runtimeOnly 'com.mysql:mysql-connector-j'

    // H2 for tests
    testRuntimeOnly 'com.h2database:h2'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Activate 'local' profile for development — picks up application-local.properties
tasks.named('bootRun') {
    systemProperty 'spring.profiles.active',
            System.getenv('SPRING_PROFILES_ACTIVE') ?: 'local'
    // Override DB with environment variables if set
    if (System.getenv('DB_URL'))      systemProperty 'spring.datasource.url',      System.getenv('DB_URL')
    if (System.getenv('DB_USERNAME')) systemProperty 'spring.datasource.username', System.getenv('DB_USERNAME')
    if (System.getenv('DB_PASSWORD')) systemProperty 'spring.datasource.password', System.getenv('DB_PASSWORD')
}
